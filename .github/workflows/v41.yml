name: Update to v4.1 (one-time)
on:
  push:
    paths: ['.github/workflows/v41.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the new files and remove the old looks
        run: |
          base64 -d update.b64 > "$RUNNER_TEMP/u.txz"
          tar xJf "$RUNNER_TEMP/u.txz"
          git rm -q update.b64
          sed -i 's/\.slice(0, 4)\.map(/.slice(0, 6).map(/' providers/accuweather.js providers/openweather.js providers/pirateweather.js providers/weatherbit.js
          git rm -r -q --ignore-unmatch images css/MMM-NOAA1.css css/MMM-NOAA2.css css/MMM-NOAA3.css css/MMM-NOAA4.css examples warning.PNG warning1.png
          grep -c "slice(0, 6)" providers/*.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the tests
        run: npm test
      - name: Take screenshots on a real MagicMirror
        run: |
          git clone --depth 1 https://github.com/MagicMirrorOrg/MagicMirror "$RUNNER_TEMP/mm"
          cd "$RUNNER_TEMP/mm"
          npm install --omit=dev --no-audit --no-fund --ignore-scripts
          mkdir -p modules/MMM-NOAAV4
          cp -r "$GITHUB_WORKSPACE"/MMM-NOAAV4.js "$GITHUB_WORKSPACE"/node_helper.js "$GITHUB_WORKSPACE"/lib "$GITHUB_WORKSPACE"/providers "$GITHUB_WORKSPACE"/css "$GITHUB_WORKSPACE"/translations modules/MMM-NOAAV4/
          cat > config/config.js <<'CFG'
          let config = {
            address: "localhost", port: 8080, ipWhitelist: [], language: "en", timeFormat: 12, units: "imperial",
            modules: [
              { module: "MMM-NOAAV4", position: "top_left", config: { lat: -33.8688, lon: 151.2093, css: "light" } },
              { module: "MMM-NOAAV4", position: "top_right", config: { lat: -33.8688, lon: 151.2093, css: "dark" } }
            ]
          };
          if (typeof module !== "undefined") { module.exports = config; }
          CFG
          (TZ=Australia/Sydney node --run server > /tmp/mm.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 2; done
          pip install -q playwright
          python3 - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright
          out = os.path.join(os.environ["GITHUB_WORKSPACE"], "examples")
          os.makedirs(out, exist_ok=True)
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(executable_path="/usr/bin/google-chrome")
                  ctx = await b.new_context(viewport={"width": 1400, "height": 900}, timezone_id="Australia/Sydney")
                  pg = await ctx.new_page()
                  await pg.goto("http://localhost:8080/")
                  await pg.wait_for_function("document.querySelectorAll('.MMM-NOAAV4 .nl-temp').length === 2", timeout=90000)
                  await pg.wait_for_timeout(2500)
                  await pg.add_style_tag(content="body { background: #3d4a5c !important; }")
                  cards = await pg.query_selector_all(".MMM-NOAAV4 .nl")
                  await cards[0].screenshot(path=os.path.join(out, "light.png"))
                  await cards[1].screenshot(path=os.path.join(out, "dark.png"))
                  a = await cards[0].bounding_box(); c = await cards[1].bounding_box()
                  x = min(a["x"], c["x"]) - 16; y = min(a["y"], c["y"]) - 16
                  w = max(a["x"] + a["width"], c["x"] + c["width"]) - x + 16
                  h = max(a["y"] + a["height"], c["y"] + c["height"]) - y + 16
                  await pg.screenshot(path=os.path.join(out, "light-and-dark.png"), clip={"x": x, "y": y, "width": w, "height": h})
                  await b.close()
          asyncio.run(main())
          PY
          grep -i noaa /tmp/mm.log | tail -5 || true
          ls -la "$GITHUB_WORKSPACE/examples"
      - name: Commit
        run: |
          git config user.name "cowboysdude"
          git config user.email "cowboysdude@users.noreply.github.com"
          git add -A
          git commit -m "v4.1: white and dark weather card, new screenshots; remove old looks"
          git push
